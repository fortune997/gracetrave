<section class="max-w-7xl mx-auto px-4 py-20">

  <h2 class="text-3xl font-bold text-center mb-12">
    Destinations populaires
  </h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">

    <div
      *ngFor="let d of destinations"
      class="relative rounded-lg overflow-hidden shadow-lg group"
    >
      <img
        [src]="d.image"
        class="w-full h-64 object-cover group-hover:scale-110 transition"
        alt=""
      />

      <div class="absolute inset-0 bg-black/40 flex items-end p-4">
        <h3 class="text-white text-xl font-semibold">
          {{ d.name }}
        </h3>
         <button
      routerLink="/contact"
      class="bg-red-600 hover:bg-red-700 transition px-6 py-3 rounded-md font-semibold"
    >
      Demander un devis
    </button>
      </div>
    </div>

  </div>

</section>
